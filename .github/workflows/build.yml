name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint, audit, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # The agent is sensible crypto code: gate every change on tests
      # with coverage, clippy, and a RustSec advisory audit, then
      # publish all three to SonarCloud.
      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview clippy
          cargo install cargo-llvm-cov --locked

      - name: Test with coverage
        working-directory: e2ee/agent
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Lint
        working-directory: e2ee/agent
        run: cargo clippy --all-targets -- -D warnings

      - name: Security audit (RustSec)
        working-directory: e2ee/agent
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # cargo-llvm-cov writes package-relative paths ("src/lib.rs");
      # rewrite them relative to the repository root so SonarCloud
      # can map the coverage onto the sources.
      - name: Fix coverage report paths
        run: sed -i 's|filename="src/|filename="e2ee/agent/src/|g' e2ee/agent/cobertura.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  elisp:
    name: Elisp tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master, 2026-08-24
        with:
          version: "30.1"

      - name: Install dependencies
        run: |
          emacs --batch -Q --eval '(progn
            (require (quote package))
            (add-to-list (quote package-archives) (quote ("melpa" . "https://melpa.org/packages/")) t)
            (package-initialize)
            (package-refresh-contents)
            (dolist (pkg (quote (map persist plz taxy taxy-magit-section svg-lib transient)))
              (package-install pkg)))'

      # Build the agent so the e2ee-real tests can run against it.
      - name: Build agent
        working-directory: e2ee/agent
        run: cargo build

      - name: Run tests
        run: |
          emacs --batch -Q -L . $(ls -d ~/.emacs.d/elpa/*/ | sed 's/^/-L /' | tr '\n' ' ') \
            -l leman-structs.el -l leman-lib.el -l leman-macros.el -l leman-room.el -l leman.el \
            -l leman-e2ee.el -l leman-notify.el -l leman-notifications.el \
            -l tests/leman-tests.el -l tests/leman-e2ee-tests.el -l tests/leman-notify-tests.el -f ert-run-tests-batch

  release-agent:
    name: Publish prebuilt E2EE agents
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [build, elisp]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: leman-agent-linux-x86_64
#           - os: macos-13
#             asset: leman-agent-macos-x86_64
#           - os: macos-14
#             asset: leman-agent-macos-aarch64
#           - os: windows-latest
#             asset: leman-agent-windows-x86_64.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build release agent
        working-directory: e2ee/agent
        run: cargo build --release

      - name: Package release asset
        shell: bash
        run: |
          mkdir dist
          cp "e2ee/agent/target/release/leman-agent${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.asset }}"
          shasum -a 256 "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
          printf '%s\\n' "$GITHUB_SHA" > "dist/${{ matrix.asset }}.revision"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  publish-agent-release:
    name: Update prebuilt E2EE agent release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: release-agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: leman-agent-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: leman-agent-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view leman-agent-latest >/dev/null 2>&1; then
            gh release upload leman-agent-latest dist/* --clobber
          else
            gh release create leman-agent-latest dist/* --title 'Leman E2EE agent (latest)' --notes 'Prebuilt E2EE agent binaries for package-vc installations.' --latest
          fi
